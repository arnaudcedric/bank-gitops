imagePullSecrets:
  - name: ghcr-secret

frontend:
  replicaCount: 3

  image:
    repository: ghcr.io/arnaudcedric/phegonbank-frontend
    tag: "sha-1021e26"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicaCount: 4

  image:
    repository: ghcr.io/arnaudcedric/backend_bankapp_springboot
    tag: "6ffcba5"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  env:
    port: 8080
    jwtExpirationTime: "2592000000"

  config:
    databaseName: bank
    bucketName: arnauds3

  # Do NOT commit real values here. Provide these at deploy time, e.g.:
  #   helm upgrade --install ... \
  #     --set backend.secrets.jwtSecret=$JWT_SECRET \
  #     --set backend.secrets.awsAccessKey=$AWS_ACCESS_KEY \
  #     --set backend.secrets.awsSecretKey=$AWS_SECRET_KEY
  # or via a separate, gitignored values-secrets.yaml / your CI secrets manager.
  secrets:
    jwtSecret: ""
    awsAccessKey: ""
    awsSecretKey: ""

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mysql:
  replicaCount: 1

  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3306
    targetPort: 3306

  storage:
    size: 5Gi

  # Do NOT commit real values here. Provide these at deploy time, e.g.:
  #   helm upgrade --install ... \
  #     --set mysql.secrets.rootPassword=$MYSQL_ROOT_PASSWORD \
  #     --set mysql.secrets.username=$MYSQL_USER \
  #     --set mysql.secrets.password=$MYSQL_PASSWORD
  # or via a separate, gitignored values-secrets.yaml / your CI secrets manager.
  secrets:
    rootPassword: ""
    username: ""
    password: ""

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: true
  className: nginx
  host: ""
