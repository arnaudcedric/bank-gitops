apiVersion: v1
kind: Secret

metadata:
  name: backend-secret
  namespace: {{ .Release.Namespace }}

type: Opaque

stringData:
  JWT_SECRET: {{ required "backend.secrets.jwtSecret is required. Pass it via --set or a non-committed secrets values file (e.g. --set backend.secrets.jwtSecret=$JWT_SECRET)." .Values.backend.secrets.jwtSecret | quote }}
  AWS_ACCESS_KEY: {{ required "backend.secrets.awsAccessKey is required. Pass it via --set or a non-committed secrets values file (e.g. --set backend.secrets.awsAccessKey=$AWS_ACCESS_KEY)." .Values.backend.secrets.awsAccessKey | quote }}
  AWS_SECRETE_KEY: {{ required "backend.secrets.awsSecretKey is required. Pass it via --set or a non-committed secrets values file (e.g. --set backend.secrets.awsSecretKey=$AWS_SECRET_KEY)." .Values.backend.secrets.awsSecretKey | quote }}
