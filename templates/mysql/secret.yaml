apiVersion: v1
kind: Secret

metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}

type: Opaque

stringData:
  MYSQL_ROOT_PASSWORD: {{ required "mysql.secrets.rootPassword is required. Pass it via --set or a non-committed secrets values file (e.g. --set mysql.secrets.rootPassword=$MYSQL_ROOT_PASSWORD)." .Values.mysql.secrets.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.backend.config.databaseName | quote }}
  MYSQL_USER: {{ required "mysql.secrets.username is required. Pass it via --set or a non-committed secrets values file (e.g. --set mysql.secrets.username=$MYSQL_USER)." .Values.mysql.secrets.username | quote }}
  MYSQL_PASSWORD: {{ required "mysql.secrets.password is required. Pass it via --set or a non-committed secrets values file (e.g. --set mysql.secrets.password=$MYSQL_PASSWORD)." .Values.mysql.secrets.password | quote }}
